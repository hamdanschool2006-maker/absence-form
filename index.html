<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رصد الغياب | مدرسة الشيخ حمدان بن خميس اليوسفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16233b; --ink-2:#4a5872; --line:#dfe4ec; --bg:#eef2f6; --card:#ffffff;
  --red:#c8102e; --red-soft:#fdecef; --green:#007a3d; --green-soft:#e6f4ec; --amber:#b26a00;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",Arial,sans-serif;font-size:16px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fdd;outline-offset:2px}
.hidden{display:none!important}

/* شريط العلم */
.flag{height:6px;background:linear-gradient(90deg,var(--green) 0 33.3%,#fff 33.3% 66.6%,var(--red) 66.6%)}
header{background:var(--ink);color:#fff;padding:14px 18px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:17px;font-weight:700}
header small{display:block;opacity:.75;font-size:13px;font-weight:400}
header button{background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:8px;padding:6px 12px;font-size:14px}
.wrap{max-width:760px;margin:0 auto}
main{padding:16px 14px 120px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 12px;font-size:15px;font-weight:600;color:var(--ink-2)}
label.f{display:block;font-size:14px;color:var(--ink-2);margin-bottom:6px}
input.t{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff}
input.t:focus{border-color:var(--ink)}

/* الدخول */
.login{max-width:400px;margin:40px auto}
.login .panel{padding:24px}
.login h2{font-size:20px;color:var(--ink);margin-bottom:4px}
.login p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.stack>*+*{margin-top:14px}
.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--ink);color:#fff;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.err{color:var(--red);font-size:14px;min-height:1.2em}

/* التاريخ */
.daterow{display:flex;gap:12px;align-items:center}
.daterow input{flex:1}
.dayname{font-weight:700;font-size:18px;min-width:88px;text-align:center}

/* الحصص: العنصر المميز */
.periods{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.p{aspect-ratio:1/1.1;border:1.5px solid var(--line);background:#fff;border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.p b{font-size:22px;line-height:1}
.p span{font-size:11px;color:var(--ink-2)}
.p[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.p[aria-pressed="true"] span{color:#c9d3e6}
.linkbtn{background:none;border:0;color:#2f6fdd;padding:6px 0;font-size:14px;margin-top:6px}

/* الصف والشعبة */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button,.chips button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-weight:500}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{min-width:48px;padding:7px 10px}

/* الطلاب */
.listhead{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.listhead input{flex:1;min-width:160px}
.ghost{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500}
.count{font-size:13px;color:var(--ink-2);margin-bottom:8px}
ul.st{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.st li{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;cursor:pointer;user-select:none}
.row .n{width:26px;text-align:center;color:var(--ink-2);font-size:13px;flex:none}
.row .nm{flex:1;font-size:15px}
.row .tag{display:block;font-size:12px;color:var(--amber);margin-top:1px}
.box{width:26px;height:26px;border:2px solid #b8c2d3;border-radius:7px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff}
li.on{background:var(--red-soft)}
li.on .box{background:var(--red);border-color:var(--red)}
li.on .box::after{content:"غ"}
li.part .box{border-color:var(--amber);background:#fff4e0}
li.part .box::after{content:"–";color:var(--amber)}
.note{display:none;padding:0 40px 10px 4px}
li.on .note{display:block}
.note input{width:100%;border:1px solid #efc2ca;border-radius:8px;padding:7px 10px;font-size:14px;background:#fff}
.empty{color:var(--ink-2);text-align:center;padding:26px 8px;font-size:14px}

/* شريط الحفظ */
.savebar{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.savebar .wrap{display:flex;gap:12px;align-items:center}
.savebar .sum{flex:1;font-size:14px;color:var(--ink-2)}
.savebar .sum b{color:var(--ink)}
.savebar .btn{width:auto;background:var(--red);padding:12px 22px}

.toast{position:fixed;top:16px;inset-inline:16px;max-width:520px;margin:auto;padding:12px 16px;border-radius:10px;
  background:var(--green);color:#fff;font-weight:500;box-shadow:0 6px 20px rgba(22,35,59,.2);z-index:9}
.toast.bad{background:var(--red)}
.loading{opacity:.55;pointer-events:none}
@media (max-width:420px){ .p b{font-size:19px} .p span{display:none} .p{aspect-ratio:1/1} }
@media (prefers-reduced-motion:no-preference){ .toast{animation:drop .25s ease-out} @keyframes drop{from{transform:translateY(-12px);opacity:0}} }
</style>
</head>
<body>
<div class="flag"></div>
<header><div class="wrap">
  <h1>رصد غياب الطلاب<small>مدرسة الشيخ حمدان بن خميس اليوسفي (7–10)</small></h1>
  <button id="logoutBtn" class="hidden">خروج</button>
</div></header>

<!-- الدخول -->
<section id="loginView" class="login"><div class="panel stack">
  <div><h2>تسجيل دخول المعلم</h2><p>استخدم رقمك المدني وكلمة المرور التي زودتك بها الإدارة.</p></div>
  <div><label class="f" for="civil">الرقم المدني</label><input class="t" id="civil" inputmode="numeric" autocomplete="username"></div>
  <div><label class="f" for="pass">كلمة المرور</label><input class="t" id="pass" type="password" autocomplete="current-password"></div>
  <div class="err" id="loginErr"></div>
  <button class="btn" id="loginBtn">دخول</button>
</div></section>

<!-- الرصد -->
<main id="appView" class="hidden"><div class="wrap">
  <div class="panel">
    <h2>اليوم</h2>
    <div class="daterow"><input class="t" type="date" id="date"><div class="dayname" id="dayname"></div></div>
  </div>

  <div class="panel">
    <h2>الحصة</h2>
    <div class="periods" id="periods"></div>
    <button class="linkbtn" id="allDay">تحديد اليوم كاملًا (الحصص 1–7)</button>
  </div>

  <div class="panel">
    <h2>الصف والشعبة</h2>
    <div class="seg" id="grades"></div>
    <div class="chips" id="sections"></div>
  </div>

  <div class="panel" id="listPanel">
    <h2 id="listTitle">الطلاب</h2>
    <div id="listBody"><div class="empty">اختر الصف والشعبة لعرض الطلاب.</div></div>
  </div>
</div></main>

<div class="savebar hidden" id="savebar"><div class="wrap">
  <div class="sum" id="sum"></div>
  <button class="btn" id="saveBtn">حفظ الغياب</button>
</div></div>

<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const S={token:null,name:'',classes:[],today:'',periods:new Set(),grade:null,section:null,
  students:[],recorded:{},checked:{},notes:{},touched:new Set(),filter:''};
const $=id=>document.getElementById(id);

// ضع هنا رابط تطبيق الويب الذي ينتهي بـ /exec
const API_URL='https://script.google.com/macros/s/AKfycbz40K2J9UpT7Qc6E3Nfhywqs3LdnX9wAHUZ64fo-kbF1Rp9seJIJ-2TUpUJbjLZo1-duw/exec';

async function call(fn,...args){
  let r;
  try{
    r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:fn,args:args})});
  }catch(e){ throw new Error('تعذر الاتصال بالخادم. تحقق من الإنترنت.'); }
  const j=await r.json();
  if(!j.ok) throw new Error(j.error);
  return j.data;
}
function msg(e){ return (e&&e.message?e.message:String(e)).replace(/^Error:\s*/,''); }
function toast(text,bad){
  const t=document.createElement('div'); t.className='toast'+(bad?' bad':''); t.textContent=text;
  document.body.appendChild(t); setTimeout(()=>t.remove(),bad?5000:3000);
}
function store(k,v){ try{ v===null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(e){} }
function handleErr(e){
  const m=msg(e); toast(m,true);
  if(m.indexOf('انتهت الجلسة')>-1) logoutLocal();
}

/* ---- الدخول ---- */
async function doLogin(){
  const c=$('civil').value.trim(), p=$('pass').value;
  $('loginErr').textContent=''; $('loginBtn').disabled=true; $('loginBtn').textContent='جارٍ التحقق…';
  try{
    const r=await call('login',c,p);
    S.token=r.token; S.name=r.name; S.classes=r.classes; S.today=r.today;
    store('absToken',r.token); store('absName',r.name);
    startApp();
  }catch(e){ $('loginErr').textContent=msg(e); }
  finally{ $('loginBtn').disabled=false; $('loginBtn').textContent='دخول'; }
}
$('loginBtn').onclick=doLogin;
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') doLogin(); });

function logoutLocal(){
  store('absToken',null); S.token=null;
  $('appView').classList.add('hidden'); $('savebar').classList.add('hidden'); $('logoutBtn').classList.add('hidden');
  $('loginView').classList.remove('hidden'); $('pass').value='';
}
$('logoutBtn').onclick=()=>{ call('logout',S.token).catch(()=>{}); logoutLocal(); };

function startApp(){
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden'); $('logoutBtn').classList.remove('hidden');
  document.querySelector('header h1').firstChild.textContent='رصد الغياب: '+S.name;
  const d=$('date'); d.max=S.today; if(!d.value) d.value=S.today; showDay();
  renderPeriods(); renderGrades();
}

/* ---- التاريخ ---- */
function showDay(){
  const v=$('date').value; if(!v){ $('dayname').textContent=''; return; }
  const [y,m,dd]=v.split('-').map(Number);
  $('dayname').textContent=DAYS[new Date(Date.UTC(y,m-1,dd)).getUTCDay()];
}
$('date').onchange=()=>{ if($('date').value>S.today) $('date').value=S.today; showDay(); if(S.section) loadStudents(); };

/* ---- الحصص ---- */
function renderPeriods(){
  const box=$('periods'); box.innerHTML='';
  for(let i=1;i<=7;i++){
    const b=document.createElement('button'); b.className='p';
    b.setAttribute('aria-pressed',S.periods.has(String(i)));
    b.setAttribute('aria-label','الحصة '+i);
    b.innerHTML='<b>'+i+'</b><span>الحصة</span>';
    b.onclick=()=>{ const k=String(i); S.periods.has(k)?S.periods.delete(k):S.periods.add(k); renderPeriods(); renderList(); };
    box.appendChild(b);
  }
  $('allDay').textContent = S.periods.size===7 ? 'إلغاء تحديد الحصص' : 'تحديد اليوم كاملًا (الحصص 1–7)';
}
$('allDay').onclick=()=>{
  if(S.periods.size===7) S.periods.clear(); else for(let i=1;i<=7;i++) S.periods.add(String(i));
  renderPeriods(); renderList();
};

/* ---- الصفوف والشعب ---- */
function renderGrades(){
  const g=$('grades'); g.innerHTML='';
  S.classes.forEach(c=>{
    const b=document.createElement('button'); b.textContent=c.grade; b.setAttribute('aria-pressed',S.grade===c.grade);
    b.onclick=()=>{ S.grade=c.grade; S.section=null; S.students=[]; renderGrades(); renderList(); };
    g.appendChild(b);
  });
  const s=$('sections'); s.innerHTML='';
  const cur=S.classes.find(c=>c.grade===S.grade);
  if(!cur){ s.innerHTML='<span class="count">اختر الصف أولًا.</span>'; return; }
  cur.sections.forEach(sec=>{
    const b=document.createElement('button'); b.textContent=sec; b.setAttribute('aria-pressed',S.section===sec);
    b.setAttribute('aria-label','الشعبة '+sec);
    b.onclick=()=>{ S.section=sec; renderGrades(); loadStudents(); };
    s.appendChild(b);
  });
}

/* ---- الطلاب ---- */
async function loadStudents(){
  $('listPanel').classList.add('loading');
  try{
    const r=await call('getStudents',S.token,S.grade,S.section,$('date').value);
    S.students=r.students; S.recorded=r.recorded; S.checked={}; S.notes={}; S.touched=new Set(); S.filter='';
    S.students.forEach(st=>{ S.notes[st.id]=(r.recorded[st.id]||{}).note||''; });
    renderList();
  }catch(e){ handleErr(e); }
  finally{ $('listPanel').classList.remove('loading'); }
}
// حالة الطالب الأصلية بالنسبة للحصص المختارة: all | some | none
function initial(id){
  const rec=S.recorded[id]; if(!rec||!S.periods.size) return 'none';
  let n=0; S.periods.forEach(p=>{ if(rec.periods[p]) n++; });
  return n===0?'none':(n===S.periods.size?'all':'some');
}
function isOn(id){ return S.touched.has(id) ? !!S.checked[id] : initial(id)==='all'; }

function renderList(){
  const body=$('listBody');
  $('listTitle').textContent = S.section ? ('طلاب الصف '+S.grade+' / '+S.section) : 'الطلاب';
  if(!S.section||!S.students.length){
    body.innerHTML='<div class="empty">'+(S.section?'لا يوجد طلاب في هذه الشعبة.':'اختر الصف والشعبة لعرض الطلاب.')+'</div>';
    updateBar(); return;
  }
  body.innerHTML='';
  const head=document.createElement('div'); head.className='listhead';
  head.innerHTML='<input class="t" id="q" placeholder="ابحث باسم الطالب" value="'+S.filter.replace(/"/g,'')+'">'+
    '<button class="ghost" id="selAll">تحديد الكل غائبًا</button><button class="ghost" id="clrAll">إلغاء التحديد</button>';
  body.appendChild(head);
  const cnt=document.createElement('div'); cnt.className='count'; body.appendChild(cnt);
  if(!S.periods.size){ cnt.textContent='اختر الحصة أولًا، ثم حدد الطلاب الغائبين.'; }
  const ul=document.createElement('ul'); ul.className='st'; body.appendChild(ul);

  const shown=S.students.filter(st=>!S.filter||st.name.indexOf(S.filter)>-1);
  shown.forEach(st=>{
    const li=document.createElement('li');
    const on=isOn(st.id), part=!S.touched.has(st.id)&&initial(st.id)==='some';
    if(on) li.className='on'; else if(part) li.className='part';
    const rec=S.recorded[st.id];
    const tag=rec?'<span class="tag">مرصود اليوم: '+Object.keys(rec.periods).sort().map(p=>'ح'+p).join('، ')+'</span>':'';
    li.innerHTML='<div class="row" role="checkbox" tabindex="0" aria-checked="'+on+'"><span class="n">'+st.m+'</span>'+
      '<span class="nm">'+st.name+tag+'</span><span class="box"></span></div>'+
      '<div class="note"><input placeholder="ملاحظة (اختياري): مستأذن، مريض، متأخر…" maxlength="300"></div>';
    const row=li.querySelector('.row'), inp=li.querySelector('.note input');
    inp.value=S.notes[st.id]||'';
    const toggle=()=>{
      if(!S.periods.size){ toast('اختر الحصة أولًا.',true); return; }
      S.checked[st.id]=!isOn(st.id); S.touched.add(st.id); renderList();
    };
    row.onclick=toggle;
    row.onkeydown=e=>{ if(e.key===' '||e.key==='Enter'){ e.preventDefault(); toggle(); } };
    inp.oninput=()=>{ S.notes[st.id]=inp.value; S.checked[st.id]=true; S.touched.add(st.id); updateBar(); };
    ul.appendChild(li);
  });

  const q=$('q'); q.oninput=()=>{ S.filter=q.value.trim(); const pos=q.selectionStart; renderList(); const n=$('q'); n.focus(); n.setSelectionRange(pos,pos); };
  $('selAll').onclick=()=>{ if(!S.periods.size){ toast('اختر الحصة أولًا.',true); return; } shown.forEach(st=>{S.checked[st.id]=true;S.touched.add(st.id);}); renderList(); };
  $('clrAll').onclick=()=>{ shown.forEach(st=>{S.checked[st.id]=false;S.touched.add(st.id);}); renderList(); };
  const absentNow=S.students.filter(st=>isOn(st.id)).length;
  if(S.periods.size) cnt.textContent='عدد الطلاب '+S.students.length+'، المحدد غيابهم '+absentNow+'. اضغط على اسم الطالب لتحديده.';
  updateBar();
}

function changes(){
  const absent=[], cleared=[];
  S.touched.forEach(id=>{
    const st=S.students.find(s=>s.id===id); if(!st) return;
    if(S.checked[id]) absent.push({id:id,name:st.name,note:S.notes[id]||''});
    else if(initial(id)!=='none') cleared.push(id);
  });
  return {absent,cleared};
}
function updateBar(){
  const bar=$('savebar');
  if(!S.section||!S.students.length){ bar.classList.add('hidden'); return; }
  bar.classList.remove('hidden');
  const {absent,cleared}=changes();
  const ps=[...S.periods].sort((a,b)=>a-b);
  const pTxt=!ps.length?'لم تُختر حصة':(ps.length===7?'اليوم كامل':(ps.length===1?'الحصة '+ps[0]:'الحصص '+ps.join('، ')));
  let t='<b>'+absent.length+'</b> غائب في '+pTxt;
  if(cleared.length) t+='، وإلغاء غياب <b>'+cleared.length+'</b>';
  $('sum').innerHTML=t;
  $('saveBtn').disabled=!ps.length||(!absent.length&&!cleared.length);
}

$('saveBtn').onclick=async()=>{
  const {absent,cleared}=changes();
  const btn=$('saveBtn'); btn.disabled=true; btn.textContent='جارٍ الحفظ…';
  try{
    const r=await call('saveAbsence',S.token,{date:$('date').value,periods:[...S.periods],grade:S.grade,section:S.section,absent,cleared});
    toast('تم حفظ الغياب: '+absent.length+' طالب'+(cleared.length?('، وإلغاء غياب '+cleared.length):'')+'.');
    await loadStudents();
  }catch(e){ handleErr(e); }
  finally{ btn.textContent='حفظ الغياب'; updateBar(); }
};

/* ---- استعادة الجلسة ---- */
(async()=>{
  let t=null; try{ t=sessionStorage.getItem('absToken'); S.name=sessionStorage.getItem('absName')||''; }catch(e){}
  if(!t) return;
  try{ S.token=t; S.classes=await call('getClasses',t);
    const d=new Date(); S.today=new Date(d.getTime()+ (4*60+d.getTimezoneOffset())*60000).toISOString().slice(0,10); // توقيت مسقط
    startApp();
  }catch(e){ store('absToken',null); S.token=null; }
})();
</script>
</body>
</html>
